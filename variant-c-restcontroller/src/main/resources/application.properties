spring.datasource.url=jdbc:postgresql://localhost:${BENCH_DB_PORT:5433}/bench
spring.datasource.username=bench
spring.datasource.password=bench
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=bench-pool

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=${BENCH_PORT:8082}
server.tomcat.threads.max=200
server.tomcat.accept-count=200

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=variant-c

logging.level.root=warn
